# sshd — SSH server and outbound SSH client for spangap.
#
# Server KEX: mlkem768x25519-sha256 (preferred) + curve25519-sha256.
# Ed25519 host/user keys, ChaCha20-Poly1305 cipher. The server hard-wires the
# session channel to three destinations: shell → cli, exec <cmd> → cli (one
# shot), `subsystem log` → log. The client (ssh) dials out and runs a command
# or shell. No port forwarding, no SFTP, no rekey.
schema_version: 1
name: spangap/sshd
prefix: sshd
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: spangap-inside folds this into the buildable's generated
# spangapInitStraddles() dispatcher, so `--with spangap/sshd` brings the
# daemon up with no consumer main.cpp edit. sshdInit() needs net + storage +
# cli — all up by the time the straddle band runs (net is in the platform band,
# `requires: spangap/spangap-net` makes it explicit). s.sshd.enabled defaults on,
# so it starts listening — but admits no one until a key (or password) is set.
init:
  - call: sshdInit
# Browser auto-registration (parallel to init:): staging sshd into a browser
# buildable imports registerSshd (sshd/modules/sshd) into straddles.gen.ts and
# injects the file: dep — the SSH server pane appears under Settings → Services
# automatically, no consumer edit.
browser_register:
  - call: registerSshd

# Declarative settings: the LCD pane + the s.sshd.enabled default are generated
# from this block. web: false — SshdPanel.vue keeps the web leaf (it hosts the
# authorized-keys editor, which a static descriptor can't express). Enabled by
# default: sshd never admits anyone without an authorized key, so listening is safe.
settings:
  - menu:
      - { id: network, label: "Internet", placement: 2 }
      - { id: ssh, label: "SSH" }
    web: false
    rows:
      - section: "SSH server"
      - switch: { label: "Enabled", key: "s.sshd.enabled", default: 1 }
