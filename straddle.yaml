# sshd — SSH server and outbound SSH client for spangap.
#
# Server KEX: mlkem768x25519-sha256 (preferred) + curve25519-sha256.
# Ed25519 host/user keys, ChaCha20-Poly1305 cipher. The server hard-wires the
# session channel to three destinations: shell → cli, exec <cmd> → cli (one
# shot), `subsystem log` → log. The client (ssh) dials out and runs a command
# or shell. No port forwarding, no SFTP, no rekey.
schema_version: 1
name: spangap/sshd
prefix: sshd
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: spangap-inside folds this into the buildable's generated service
# registry, so `--with spangap/sshd` brings the daemon up with no consumer
# main.cpp edit. SshdService::onInit() needs net + storage + cli — all up by the
# time the straddle band runs (net is in the platform band, `requires:
# spangap/spangap-net` makes it explicit). s.sshd.enabled defaults on, so it
# starts listening — but admits no one until a key (or password) is set.
services:
  - { class: SshdService, header: sshd.h }

# Declarative settings: both surfaces + the s.sshd.enabled default are generated
# from this block, the authorized-key editor included — sshd.cpp owns every
# mutation through the sshd.key.* sentinels and validates there. Enabled by
# default: sshd never admits anyone without an authorized key, so listening is safe.
settings:
  - at:
      - { id: net }
      - { id: ssh, label: "SSH", short: "SSH", order: 3 }
    rows:
      - title: "SSH"
      - heading: "SSH server"
      - switch: { label: "Enable SSH", key: "s.sshd.enabled", default: 1 }
      # The key store is an array of per-field objects; sshd.cpp owns every
      # mutation through the sshd.key.* sentinels and validates there, so a
      # rejected key comes back as a sentence rather than as a UI rule.
      - list:
          label: "Authorized keys"
          key: s.sshd.authorized_keys
          id: id
          item: "{label}"
          empty: "No authorized keys — add an ssh-ed25519 public key to allow logins."
          cmd: sshd.key
          add:
            - label: "Add SSH key"
              form:
                title: "Add SSH key"
                submit: "Add"
                fields:
                  - text: { label: "Key", field: line, placeholder: "ssh-ed25519 AAAA… comment" }
          remove: { confirm: "Remove {label}?" }
