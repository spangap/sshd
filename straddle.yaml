# sshd — minimal SSH server for spangap.
#
# Curve25519 KEX + Ed25519 host/user keys + ChaCha20-Poly1305 only.
# Hard-wired to two destinations: shell channel → cli, `subsystem log` → log.
# No port forwarding, no exec, no SFTP, no rekey.
schema_version: 1
name: spangap/sshd
prefix: sshd
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: spangap-inside folds this into the buildable's generated
# spangapInitStraddles() dispatcher, so `--with spangap/sshd` brings the
# daemon up with no consumer main.cpp edit. sshdInit() needs net + storage +
# cli — all up by the time the straddle band runs (net is in the platform band,
# `requires: spangap/spangap-net` makes it explicit). s.sshd.enabled defaults on,
# so it starts listening — but admits no one until a key (or password) is set.
init:
  - call: sshdInit
  - call: sshdLcdRegister
    when: spangap/spangap-lcd
# Browser auto-registration (parallel to init:): staging sshd into a browser
# buildable imports registerSshd (sshd/modules/sshd) into straddles.gen.ts and
# injects the file: dep — the SSH server pane appears under Settings → Services
# automatically, no consumer edit.
browser_register:
  - call: registerSshd
