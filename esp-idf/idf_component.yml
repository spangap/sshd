description: "sshd: minimal SSH server for spangap. Curve25519 + Ed25519 + ChaCha20-Poly1305 only. Hard-wired to cli and log."
url: https://github.com/spangap/sshd
version: "0.1.0"
license: "Apache-2.0"
targets:
  - esp32s3
dependencies:
  idf:
    version: ">=5.5"
  # Cross-straddle deps are declared in straddle.yaml's `requires:` and staged
  # short-named via EXTRA_COMPONENT_DIRS at consumer-build time — not here, to
  # avoid double-staging under the manager's namespaced form.
